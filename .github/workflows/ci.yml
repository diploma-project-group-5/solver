name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; runs on develop/main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, resolved 2026-11-08
        with:
          fetch-depth: 0  # gitleaks scans the history
          persist-credentials: false  # no GITHUB_TOKEN in .git/config (it is mounted into gitleaks)

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run pyright

      # Contract conformance (schemas, topic manifest, job-lifecycle vectors) runs against a pinned
      # contracts commit. Bump CONTRACTS_REF together with any change to the solver's events.
      - name: Check out contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, resolved 2026-11-08
        with:
          repository: diploma-project-group-5/contracts
          ref: v0.2.0  # tag on the merge commit 4e4759a
          path: _contracts
          persist-credentials: false

      - name: Unit and contract tests
        env:
          LAD_CONTRACTS_DIR: ${{ github.workspace }}/_contracts
        # tests/realistic runs in its own job (minutes of CP-SAT time, see the scenarios job).
        run: uv run pytest -m "not integration" --ignore=tests/realistic --cov --cov-report=term-missing

      - name: Dependency audit
        # The worker extra ships in the image (confluent-kafka, pydantic), so it is audited too.
        run: |
          uv export --locked --no-dev --extra worker --no-emit-project --format requirements-txt \
            > "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/req.txt"

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

  integration:
    needs: checks
    runs-on: ubuntu-24.04  # Docker is available for testcontainers (apache/kafka, KRaft)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, resolved 2026-11-08
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Integration tests (Kafka in testcontainers)
        run: uv run pytest -m integration

  scenarios:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, resolved 2026-11-08
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Realistic school scenarios
        run: uv run pytest tests/realistic -m ""

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, resolved 2026-11-08
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag lad-solver:${{ github.sha }} .
      # The default command is the Kafka worker, which needs a broker; smoke-test the CLI instead.
      - name: Smoke-run image
        run: |
          docker run --rm lad-solver:${{ github.sha }} --help
          docker run --rm --entrypoint sh lad-solver:${{ github.sha }} -c \
            'lad-solver generate --classes 3 --shelter-ratio 0.5 --out /tmp/p.json &&
             lad-solver solve --in /tmp/p.json --out /tmp/r.json --time-limit 5 --workers 1'

